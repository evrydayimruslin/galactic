<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Galactic sign-in link</title>
  </head>
  <body
    style="margin: 0; background: #f6f6f4; color: #151515; font-family: Arial, sans-serif"
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 520px; background: #ffffff; border: 1px solid #deded9; border-radius: 16px"
          >
            <tr>
              <td style="padding: 36px">
                <div
                  style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em"
                >
                  Galactic
                </div>
                <h1
                  style="margin: 28px 0 12px; font-size: 26px; line-height: 1.2; font-weight: 600"
                >
                  Sign in to Galactic
                </h1>
                <p
                  style="margin: 0 0 24px; color: #5f5f5b; font-size: 15px; line-height: 1.6"
                >
                  Use the button below to continue. This one-time link expires
                  in one hour.
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next={{ .RedirectTo }}"
                  style="display: inline-block; padding: 13px 20px; border-radius: 10px; background: #151515; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700"
                >
                  Continue to Galactic
                </a>
                <p
                  style="margin: 28px 0 0; color: #85857f; font-size: 12px; line-height: 1.5"
                >
                  If you did not request this email, you can safely ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

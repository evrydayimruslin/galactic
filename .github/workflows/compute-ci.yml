name: Compute CI

on:
  pull_request:
    paths:
      - 'compute-worker/**'
      - 'cli/**'
      - 'examples/interface-demo/**'
      - '.dockerignore'
      - 'shared/contracts/compute.ts'
      - 'api/services/compute/**'
      - 'api/services/compute-*.ts'
      - 'api/src/bindings/compute-*.ts'
      - 'api/src/compute-control-plane-entrypoint.ts'
      - 'api/wrangler.toml'
      - 'supabase/migrations/*compute*.sql'
      - 'scripts/supabase/**'
      - 'scripts/release/verify-api-compute-deploy-state.mjs'
      - 'scripts/release/verify-api-compute-deploy-state.test.mjs'
      - 'scripts/release/verify-api-compute-off-bridge.mjs'
      - 'scripts/release/verify-api-compute-off-bridge.test.mjs'
      - 'scripts/release/verify-production-compute-release-evidence.mjs'
      - 'scripts/release/verify-production-compute-release-evidence.test.mjs'
      - 'scripts/smoke/compute-admitted-smoke.mjs'
      - 'scripts/smoke/compute-admitted-smoke.test.mjs'
      - 'scripts/smoke/interface-deploy-smoke.mjs'
      - 'scripts/smoke/interface-deploy-promotion.mjs'
      - 'scripts/smoke/interface-deploy-promotion.test.mjs'
      - 'scripts/smoke/with-staging-owner-session.mjs'
      - 'scripts/smoke/with-staging-owner-session.test.mjs'
      - 'docs/GALACTIC_COMPUTE_*.md'
      - '.github/workflows/supabase-db.yml'
      - '.github/workflows/supabase-production-db.yml'
      - '.github/workflows/compute-ci.yml'
      - '.github/workflows/compute-deploy.yml'
      - '.github/workflows/compute-admission.yml'
      - '.github/workflows/api-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'compute-worker/**'
      - 'cli/**'
      - 'examples/interface-demo/**'
      - '.dockerignore'
      - 'shared/contracts/compute.ts'
      - 'api/services/compute/**'
      - 'api/services/compute-*.ts'
      - 'api/src/bindings/compute-*.ts'
      - 'api/src/compute-control-plane-entrypoint.ts'
      - 'api/wrangler.toml'
      - 'supabase/migrations/*compute*.sql'
      - 'scripts/supabase/**'
      - 'scripts/release/verify-api-compute-deploy-state.mjs'
      - 'scripts/release/verify-api-compute-deploy-state.test.mjs'
      - 'scripts/release/verify-api-compute-off-bridge.mjs'
      - 'scripts/release/verify-api-compute-off-bridge.test.mjs'
      - 'scripts/release/verify-production-compute-release-evidence.mjs'
      - 'scripts/release/verify-production-compute-release-evidence.test.mjs'
      - 'scripts/smoke/compute-admitted-smoke.mjs'
      - 'scripts/smoke/compute-admitted-smoke.test.mjs'
      - 'scripts/smoke/interface-deploy-smoke.mjs'
      - 'scripts/smoke/interface-deploy-promotion.mjs'
      - 'scripts/smoke/interface-deploy-promotion.test.mjs'
      - 'scripts/smoke/with-staging-owner-session.mjs'
      - 'scripts/smoke/with-staging-owner-session.test.mjs'
      - 'docs/GALACTIC_COMPUTE_*.md'
      - '.github/workflows/supabase-db.yml'
      - '.github/workflows/supabase-production-db.yml'
      - '.github/workflows/compute-ci.yml'
      - '.github/workflows/compute-deploy.yml'
      - '.github/workflows/compute-admission.yml'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Worker and developer-v1 image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: compute-worker
    env:
      # Repository variable, not a secret. It must be a complete immutable ref:
      # docker.io/cloudflare/sandbox:0.12.3-python@sha256:<64 lowercase hex>
      SANDBOX_BASE_IMAGE: ${{ vars.COMPUTE_SANDBOX_BASE_IMAGE }}
      IMAGE_TAG: galactic-compute-ci:${{ github.sha }}
      EVIDENCE_DIR: ${{ github.workspace }}/compute-worker/evidence

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: compute-worker/package-lock.json

      - name: Initialize evidence packet
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Require immutable Sandbox base
        shell: bash
        run: |
          set -euo pipefail
          expected='^docker\.io/cloudflare/sandbox:0\.12\.3-python@sha256:[0-9a-f]{64}$'
          if [[ ! "$SANDBOX_BASE_IMAGE" =~ $expected ]]; then
            echo "Set repository variable COMPUTE_SANDBOX_BASE_IMAGE to the reviewed 0.12.3-python image with an @sha256 digest." >&2
            exit 1
          fi
          printf '%s\n' "$SANDBOX_BASE_IMAGE" | tee "$EVIDENCE_DIR/base-image.txt"
          docker pull "$SANDBOX_BASE_IMAGE"

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck and test Worker
        run: npm run verify

      - name: Test API/Compute OFF bridge state validator
        run: >-
          node --test
          ../scripts/release/verify-api-compute-off-bridge.test.mjs

      - name: Verify local CLI compute-job mode
        shell: bash
        run: |
          set -euo pipefail
          node --test ../cli/tests/compute-job-mode.node.test.mjs
          deno_version=2.9.3
          deno_archive=deno-x86_64-unknown-linux-gnu.zip
          deno_sha256=8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6
          deno_dir="$RUNNER_TEMP/deno"
          mkdir -p "$deno_dir"
          curl -fsSL \
            "https://github.com/denoland/deno/releases/download/v${deno_version}/${deno_archive}" \
            -o "$RUNNER_TEMP/$deno_archive"
          printf '%s  %s\n' "$deno_sha256" "$RUNNER_TEMP/$deno_archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$deno_archive" -d "$deno_dir"
          pushd ../cli >/dev/null
          "$deno_dir/deno" test \
            --no-config \
            --allow-env --allow-read --allow-write --allow-net \
            --lock=deno.lock --frozen \
            tests/compute-job-mode.test.ts
          popd >/dev/null

      - name: Build immutable-input image
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --build-arg SANDBOX_BASE_IMAGE="$SANDBOX_BASE_IMAGE" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_TAG" \
            --file images/standard/Dockerfile \
            ..

      - name: Smoke actual image
        run: ./scripts/smoke-image.sh "$IMAGE_TAG"

      - name: Prepare exact image for no-copy SBOM
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_TAG" > "$EVIDENCE_DIR/image-inspect.json"
          local_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          [[ "$local_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker returned a malformed local image ID." >&2
            exit 1
          }
          base_image_id="$(docker image inspect --format '{{.Id}}' "$SANDBOX_BASE_IMAGE")"
          [[ "$base_image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker returned a malformed base image ID." >&2
            exit 1
          }
          if [ "$base_image_id" = "$local_image_id" ]; then
            echo "The built image unexpectedly equals its base image." >&2
            exit 1
          fi
          printf '%s\n' "$local_image_id" > "$EVIDENCE_DIR/local-image-id.txt"
          printf '%s\n' "$base_image_id" > "$EVIDENCE_DIR/base-image-id.txt"
          ./scripts/hash-image-inputs.sh "$EVIDENCE_DIR/build-inputs.sha256"
          node scripts/hash-migrations.mjs .. "$EVIDENCE_DIR/compute-migrations.sha256"
          migration_manifest_sha256="$(sha256sum "$EVIDENCE_DIR/compute-migrations.sha256" | cut -d ' ' -f 1)"
          printf '%s  compute-migrations.sha256\n' "$migration_manifest_sha256" \
            > "$EVIDENCE_DIR/compute-migrations-manifest.sha256"

          {
            docker system df
            echo
            df -B1 / "$(docker info --format '{{.DockerRootDir}}')" \
              "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          } > "$EVIDENCE_DIR/pre-sbom-prune-disk.txt"

          # BuildKit's completed cache is not an assurance input. Reclaim only
          # that cache, then prove the exact tagged image survived unchanged.
          # The next step scans the image's mounted root filesystem in place;
          # it never asks Docker to export or duplicate the image.
          docker builder prune --all --force \
            | tee "$EVIDENCE_DIR/docker-builder-prune.txt"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" \
            = "$local_image_id"
          {
            docker system df
            echo
            df -B1 / "$(docker info --format '{{.DockerRootDir}}')" \
              "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          } > "$EVIDENCE_DIR/post-sbom-prune-disk.txt"

      - name: Generate no-copy rootfs SBOM and provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          expected_image_id="$(cat "$EVIDENCE_DIR/local-image-id.txt")"
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          if [ "$actual_image_id" != "$expected_image_id" ]; then
            echo "The exact image changed before the CI rootfs scan." >&2
            exit 1
          fi
          syft_version=1.44.0
          syft_archive="syft_${syft_version}_linux_amd64.tar.gz"
          syft_sha256=0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a
          syft_dir="$RUNNER_TEMP/syft"
          mkdir -p "$syft_dir"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/v${syft_version}/${syft_archive}" \
            -o "$RUNNER_TEMP/$syft_archive"
          printf '%s  %s\n' "$syft_sha256" "$RUNNER_TEMP/$syft_archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$syft_archive" -C "$syft_dir" syft
          rm -f "$RUNNER_TEMP/$syft_archive"
          syft_output_dir="$EVIDENCE_DIR/syft-output"
          install -d -m 0777 "$syft_output_dir"

          # CI needs a complete vulnerability inventory, not a release
          # attestation. Execute the pinned Syft binary inside the exact local
          # image ID and scan its mounted root filesystem directly. The
          # container cannot write that filesystem, reach a network, or inherit
          # host credentials. Its only capability is read/search so package
          # files cannot disappear from the inventory behind Unix modes.
          # Production deploy separately attests the immutable pushed registry
          # manifest.
          docker run --rm \
            --name compute-ci-sbom-scan \
            --read-only \
            --network none \
            --cap-drop ALL \
            --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges=true \
            --user 0:0 \
            --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
            --mount "type=bind,src=$syft_dir/syft,dst=/__galactic_syft,readonly" \
            --mount "type=bind,src=$syft_output_dir,dst=/__galactic_output" \
            --env HOME=/tmp \
            --env XDG_CACHE_HOME=/tmp/.cache \
            --env SYFT_CHECK_FOR_APP_UPDATE=false \
            --entrypoint /__galactic_syft \
            "$expected_image_id" \
            "dir:/" \
            --source-name "$IMAGE_TAG" \
            --source-version "$expected_image_id" \
            --exclude './__galactic_syft' \
            --exclude './__galactic_output/**' \
            --exclude './dev/**' \
            --exclude './proc/**' \
            --exclude './sys/**' \
            --exclude './run/**' \
            --exclude './tmp/**' \
            --exclude './etc/hostname' \
            --exclude './etc/hosts' \
            --exclude './etc/resolv.conf' \
            -o "syft-json=/__galactic_output/image.syft.json" \
            -o "spdx-json=/__galactic_output/image.raw.spdx.json"
          test -s "$syft_output_dir/image.syft.json"
          test -s "$syft_output_dir/image.raw.spdx.json"
          sudo chown "$(id -u):$(id -g)" \
            "$syft_output_dir/image.syft.json" \
            "$syft_output_dir/image.raw.spdx.json"
          mv "$syft_output_dir/image.syft.json" "$EVIDENCE_DIR/image.syft.json"
          mv "$syft_output_dir/image.raw.spdx.json" \
            "$EVIDENCE_DIR/image.raw.spdx.json"
          rmdir "$syft_output_dir"

          post_scan_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          printf '%s\n' "$post_scan_image_id" \
            > "$EVIDENCE_DIR/post-scan-image-id.txt"
          if [ "$post_scan_image_id" != "$expected_image_id" ]; then
            echo "The exact image changed during the CI rootfs scan." >&2
            exit 1
          fi
          jq -e \
            --arg source_name "$IMAGE_TAG" \
            --arg source_version "$expected_image_id" \
            --arg syft_version "$syft_version" '
              .source.type == "directory" and
              .source.name == $source_name and
              .source.version == $source_version and
              .source.metadata.path == "/" and
              .descriptor.name == "syft" and
              .descriptor.version == $syft_version
            ' "$EVIDENCE_DIR/image.syft.json" >/dev/null || {
              echo "Syft did not produce the expected exact-image rootfs inventory." >&2
              exit 1
            }
          node scripts/normalize-syft-spdx.mjs \
            "$EVIDENCE_DIR/image.raw.spdx.json" \
            "$EVIDENCE_DIR/image.spdx.json" \
            "$EVIDENCE_DIR/sbom-corrections.json"
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg local_image_id "$expected_image_id" \
            --arg base_image "$SANDBOX_BASE_IMAGE" \
            --arg syft_version "$syft_version" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 1, git_sha: $git_sha, image_tag: $image_tag,
              local_image_id: $local_image_id, base_image: $base_image,
              sbom_mode: "mounted_rootfs_ci_vulnerability_inventory",
              release_attestation: false, syft_version: $syft_version,
              generated_at: $generated_at}' \
            > "$EVIDENCE_DIR/provenance.json"
          sha256sum \
            "$EVIDENCE_DIR/image.syft.json" \
            "$EVIDENCE_DIR/image.raw.spdx.json" \
            "$EVIDENCE_DIR/image.spdx.json" \
            "$EVIDENCE_DIR/sbom-corrections.json" \
            "$EVIDENCE_DIR/local-image-id.txt" \
            "$EVIDENCE_DIR/post-scan-image-id.txt" \
            "$EVIDENCE_DIR/provenance.json" \
            > "$EVIDENCE_DIR/sbom-files.sha256"

      - name: Release exact CI image storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect compute-ci-sbom-scan >/dev/null 2>&1; then
            docker rm --force compute-ci-sbom-scan >/dev/null
          fi
          if [ -s "$EVIDENCE_DIR/local-image-id.txt" ]; then
            local_image_id="$(cat "$EVIDENCE_DIR/local-image-id.txt")"
            if docker image inspect "$local_image_id" >/dev/null 2>&1; then
              docker image rm --force "$local_image_id" \
                | tee "$EVIDENCE_DIR/local-image-removal.txt"
            fi
          fi
          if [ -s "$EVIDENCE_DIR/base-image-id.txt" ]; then
            base_image_id="$(cat "$EVIDENCE_DIR/base-image-id.txt")"
            if docker image inspect "$base_image_id" >/dev/null 2>&1; then
              docker image rm --force "$base_image_id" \
                | tee -a "$EVIDENCE_DIR/local-image-removal.txt"
            fi
          fi
          {
            docker system df
            echo
            df -B1 / "$(docker info --format '{{.DockerRootDir}}')" \
              "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          } > "$EVIDENCE_DIR/post-sbom-image-removal-disk.txt"

      - name: Gate all critical and fixable high image vulnerabilities
        shell: bash
        run: bash scripts/scan-sbom.sh "$EVIDENCE_DIR/image.spdx.json" "$EVIDENCE_DIR"

      - name: Wrangler dry run (production)
        run: npx wrangler deploy --config wrangler.toml --dry-run --containers-rollout=none --outdir "$EVIDENCE_DIR/dry-run-production"

      - name: Wrangler dry run (staging)
        run: npx wrangler deploy --config wrangler.staging.toml --dry-run --containers-rollout=none --outdir "$EVIDENCE_DIR/dry-run-staging"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compute-ci-evidence-${{ github.sha }}
          path: compute-worker/evidence
          if-no-files-found: error
          retention-days: 30
